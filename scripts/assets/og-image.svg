<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- Share card (og:image source): the One Ring over the frikiparty night. -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a557"/>
      <stop offset="0.45" stop-color="#7a5c20"/>
      <stop offset="1" stop-color="#3a2b0b"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#f0d48a" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#f0d48a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#c9a557" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#c9a557" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#c9a557" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldtext" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d48a"/>
      <stop offset="1" stop-color="#c9a557"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="script" d="M330,133 a181,181 0 1,1 -0.1,0" fill="none"/>
  </defs>
  <rect width="1200" height="1200" fill="#0a0f0c"/>
  <g transform="translate(0,285)">
  <circle cx="330" cy="315" r="300" fill="url(#halo)"/>
  <g fill="#ece3cd">
    <circle cx="90" cy="80" r="2.4" opacity="0.30"/>
    <circle cx="220" cy="45" r="1.8" opacity="0.22"/>
    <circle cx="640" cy="70" r="2.2" opacity="0.26"/>
    <circle cx="835" cy="120" r="1.7" opacity="0.20"/>
    <circle cx="1020" cy="60" r="2.4" opacity="0.28"/>
    <circle cx="1130" cy="180" r="1.7" opacity="0.20"/>
    <circle cx="960" cy="520" r="1.9" opacity="0.18"/>
    <circle cx="1100" cy="420" r="2.2" opacity="0.22"/>
    <circle cx="560" cy="560" r="1.7" opacity="0.16"/>
    <circle cx="70" cy="500" r="1.9" opacity="0.20"/>
  </g>
  <path d="M0,630 L0,560 L160,585 L330,520 L520,575 L710,505 L890,570 L1060,530 L1240,585 L1200,630 Z" fill="#121912"/>
  <circle cx="330" cy="315" r="220" fill="none" stroke="url(#band)" stroke-width="104"/>
  <circle cx="330" cy="315" r="220" fill="none" stroke="url(#sheen)" stroke-width="104"/>
  <circle cx="330" cy="315" r="273" fill="none" stroke="#241a08" stroke-width="12"/>
  <circle cx="330" cy="315" r="167" fill="none" stroke="#241a08" stroke-width="12"/>
  <g filter="url(#glow)">
    <text fill="#ffdc8f" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-style="italic" letter-spacing="4">
      <textPath href="#script" lengthAdjust="spacingAndGlyphs" textLength="1120">Una edición para gobernarlas a todas ·</textPath>
    </text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="655" y="300" fill="url(#goldtext)" font-size="72" font-weight="700" lengthAdjust="spacing" textLength="480">FRIKIPARTY</text>
    <text x="657" y="356" fill="#b9b3a4" font-size="29" lengthAdjust="spacing" textLength="476">Reuniendo frikis frescos desde 2005</text>
